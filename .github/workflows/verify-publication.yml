name: Verify Production publication
run-name: Verify Production publication ${{ github.event.client_payload.verificationId }}
on:
  repository_dispatch:
    types: [verify-publication]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.repository == 'PointCommunity/pointsite' && github.ref == 'refs/heads/main'
    uses: PointCommunity/pointsite-staging/.github/workflows/verify-runtime.yml@e1ef2ae8369ff699550b04794c1955339d5e96de
    with:
      builder_origin: https://builder.eaglepass.io
      job_id: ${{ github.event.client_payload.verificationId }}
      nonce: ${{ github.event.client_payload.nonce }}
      target: production
