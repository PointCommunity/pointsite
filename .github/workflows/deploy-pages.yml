name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages base path
        env:
          CONFIGURED_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: |
          if [[ "$CONFIGURED_BASE_PATH" == "/" ]]; then
            resolved_base_path=""
          elif [[ -n "$CONFIGURED_BASE_PATH" ]]; then
            resolved_base_path="$CONFIGURED_BASE_PATH"
          else
            resolved_base_path="/${GITHUB_REPOSITORY#*/}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$resolved_base_path" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build static website
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
