name: Restore verified public release
run-name: Restore verified public release ${{ github.event.client_payload.jobId }}
on:
  repository_dispatch:
    types: [rollback-production]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  rollback:
    if: github.repository == 'PointCommunity/pointsite' && github.ref == 'refs/heads/main'
    uses: PointCommunity/pointsite-staging/.github/workflows/rollback-runtime.yml@33619a5d8413e748f90cb0b8a23b3d1e7a511bf0
    with:
      job_id: ${{ github.event.client_payload.jobId }}
      nonce: ${{ github.event.client_payload.nonce }}
