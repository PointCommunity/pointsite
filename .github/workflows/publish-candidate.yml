name: Publish accepted public candidate
run-name: Publish accepted public candidate ${{ github.event.client_payload.jobId }}
on:
  repository_dispatch:
    types: [publish-candidate]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    if: github.repository == 'PointCommunity/pointsite' && github.ref == 'refs/heads/main'
    uses: PointCommunity/pointsite-staging/.github/workflows/publish-production-runtime.yml@8e0a568e21cf00518cc0e8754c7ce692e83b4461
    with:
      job_id: ${{ github.event.client_payload.jobId }}
      nonce: ${{ github.event.client_payload.nonce }}
